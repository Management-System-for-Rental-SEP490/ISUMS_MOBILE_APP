<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISUMS APP - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #3bb582 0%, rgba(12, 106, 181, 0.7) 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid pattern (chấm trắng nhạt) */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Phần logo + tên app */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .app-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 14px;
      color: rgba(255,255,255,0.95);
      font-weight: 500;
    }

    /* Card trắng chứa form */
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      margin-top: 24px;
    }

    .btn-google:hover {
      background: #f9fafb;
    }

    .btn-google img {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #111;
      background: #fff;
    }

    .input::placeholder {
      color: #9ca3af;
    }

    .input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #6b7280;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 14px;
      color: #0ea5e9;
      text-decoration: none;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #0284c7;
    }

    .signup-prompt {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #6b7280;
    }

    .signup-prompt a {
      color: #0ea5e9;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="../../assets/logob.png" alt="ISUMS Logo" />
      </div>
      <h1 class="app-name">ISUMS APP</h1>
      <p class="tagline">Nhập tên và email để đăng nhập</p>
    </header>

    <main class="card">
      <form action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" name="email" placeholder="Loisbecket@gmail.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrap">
            <input type="password" id="password" class="input" name="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-password" aria-label="Hiện/ẩn mật khẩu">👁</button>
          </div>
        </div>
        <a href="#" class="forgot-link">Quên Mật Khẩu</a>
        <button type="submit" class="btn-login">Đăng Nhập</button>
      </form>

      <!-- <p class="signup-prompt">
        Chưa có tài khoản? <a href="#">Sign Up</a>
      </p> -->

      <button type="button" class="btn-google">
        <img src="https://www.google.com/favicon.ico" alt="" />
        Continue with Google
      </button>
    </main>
  </div>
</body>
</html>
